; ESP32 Wi-Fi bridge for the PIC18F8621 water-dispenser service console (EUSART2, 9600 8N1).
;
;   pio run                          build for the LOLIN S2 Mini
;   pio run -t upload                flash over USB (first time)
;   pio run -e s2mini_ota -t upload  flash over Wi-Fi (ArduinoOTA, host picservice.local)
;   pio run -e esp32dev              build for a classic ESP32 DevKit instead
;
; Passwords and optional Wi-Fi credentials come from secrets.ini (first-boot defaults only).

[platformio]
default_envs = esp32s3
extra_configs = secrets*.ini

; fallback values, overridden by secrets.ini when present
[secrets]
web_user = admin
web_pass = changeme
ap_pass = changeme1
ota_pass = changeme
wifi_ssid =
wifi_pass =

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.embed_txtfiles =
    web/index.html
    embed/baseline_GPL.txt
    embed/baseline_GCL.txt
    embed/param_info.json
build_flags =
    -DDEFAULT_WEB_USER=\"${secrets.web_user}\"
    -DDEFAULT_WEB_PASS=\"${secrets.web_pass}\"
    -DDEFAULT_AP_PASS=\"${secrets.ap_pass}\"
    -DDEFAULT_OTA_PASS=\"${secrets.ota_pass}\"
    -DDEFAULT_WIFI_SSID=\"${secrets.wifi_ssid}\"
    -DDEFAULT_WIFI_PASS=\"${secrets.wifi_pass}\"
    -DFW_VERSION=\"1.1.0\"

[env:s2mini]
extra_scripts = pre:copy_info.py
platform = ${common.platform}
framework = ${common.framework}
board = lolin_s2_mini
monitor_speed = ${common.monitor_speed}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
; PIC TX2 (RG1) -> ESP RX, ESP TX -> PIC RX2 (RG2), through a level shifter (see README)
build_flags = ${common.build_flags}
    -DPIC_RX_PIN=18
    -DPIC_TX_PIN=17
    -DLED_PIN=15

[env:s2mini_ota]
extends = env:s2mini
upload_protocol = espota
upload_port = picservice.local
upload_flags = --auth=${secrets.ota_pass}

[env:esp32dev]
extra_scripts = pre:copy_info.py
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
build_flags = ${common.build_flags}
    -DPIC_RX_PIN=16
    -DPIC_TX_PIN=17
    -DLED_PIN=2

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = picservice.local
upload_flags = --auth=${secrets.ota_pass}

; ESP32-S3 Super Mini (native-USB only; 4 MB flash). The board's silkscreen RX = GPIO44,
; TX = GPIO43 (these are UART0). Wiring: board RX (44) <- PIC TX2 (RG1); board TX (43) -> PIC RX2 (RG2),
; through a level shifter. GPIO48 drives the onboard WS2812 RGB LED, so the status LED only blinks approximately.
[env:esp32s3]
extra_scripts = pre:copy_info.py
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
; This module has 4 MB flash; the board default assumes 8 MB (partition table then
; runs past the chip -> "partition invalid ... exceeds flash chip size 0x400000" boot loop).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = ${common.monitor_speed}
board_build.embed_txtfiles = ${common.board_build.embed_txtfiles}
build_flags = ${common.build_flags}
    -DPIC_RX_PIN=44
    -DPIC_TX_PIN=43
    -DLED_PIN=48
; Move the Serial debug log / upload / monitor to native USB-CDC. Essential here: GPIO43/44 are UART0,
; so without this the Serial log would drive GPIO43 and collide with the PIC TX line on the same pin.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = picservice.local
upload_flags = --auth=${secrets.ota_pass}
